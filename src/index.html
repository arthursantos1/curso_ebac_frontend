<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
</head>
<body>
    <header>
        <div class="container">
            <h2>Sorteador</h2>
            <nav>
                <ul class="menu">
                    <li>
                        <a href="#">Inicio</a>
                    </li>
                    <li>
                        <a href="#">Sortear número</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <h1>Sorteador de números</h1>
            <p>Insira abaixo o número que deseja ser Sorteado de 1 a 100</p>
            <form id="form-sorteador">
                <input type="number" id="campo-numero" placeholder="Entre 1 a 100" required>
                <button>Sortear número</button>
            </form>
            <div class="resultado">
                O número sorteado foi: <span id="resultado-valor"></span>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; Todos os direitos reservados</p>
            <p>Exercício do Módulo 18 do Curso EBAC</p>
            <p>Desenvolvido por Arthur dos Santos</p>
        </div>
    </footer>

    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
